# Perfil de producción (Railway). Autosuficiente: no depende de application.properties (que es local).
# Se activa con SPRING_PROFILES_ACTIVE=production. Todos los secretos llegan por variables de entorno.

spring.application.name=cafeteria

# Servidor detrás de los proxies de Railway y Vercel
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
security.trust-forwarded-for=true

# Sesión
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never

# Base de datos: DB_URL/DB_USER/DB_PASSWORD, o las variables PG* que Railway inyecta con su PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
spring.datasource.username=${DB_USER:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=20000

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Subida de imágenes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Salud para el healthcheck de Railway
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# La salud de la app no debe depender de un servicio externo (SMTP de Gmail): solo base de datos y disco
management.health.mail.enabled=false

# Imágenes en Cloudinary
media.storage=cloudinary
media.cleanup.enabled=true
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

seed.dev.enabled=false
registration.enabled=${REGISTRATION_ENABLED:false}

# Correo: gmail-api (HTTPS, funciona en cualquier plan de Railway) o smtp (Railway lo bloquea fuera del plan Pro)
app.public-base-url=${APP_PUBLIC_BASE_URL}
outbox.worker.enabled=true
mail.sender=${MAIL_SENDER:gmail-api}
mail.from=${MAIL_FROM}
mail.gmail.client-id=${GMAIL_CLIENT_ID:}
mail.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
mail.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${MAIL_FROM}}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000


superadmin.email=${SUPERADMIN_EMAIL:}
superadmin.password=${SUPERADMIN_PASSWORD:}