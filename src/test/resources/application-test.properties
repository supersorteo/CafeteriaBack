spring.datasource.url=jdbc:postgresql://localhost:5432/cafeteria?currentSchema=test_it
spring.flyway.schemas=test_it
spring.flyway.default-schema=test_it
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
seed.dev.enabled=false
security.login.max-attempts=1000
media.storage=local
app.upload.dir=${java.io.tmpdir}/cafeteria-test-uploads
mail.sender=none
outbox.worker.enabled=false
registration.enabled=true
app.public-base-url=http://localhost:4200
security.public.max-attempts=1000
security.register.max-attempts=1000
media.cleanup.enabled=false
